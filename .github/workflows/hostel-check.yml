name: AFIT hostel check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostel-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run check
        env:
          AFIT_EMAIL: ${{ secrets.AFIT_EMAIL }}
          AFIT_PASSWORD: ${{ secrets.AFIT_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python hostel_check.py
